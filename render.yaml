# Configuración del static site de la web en Render (ENG-124).
#
# ---------------------------------------------------------------------------
# Por qué este archivo existe
# ---------------------------------------------------------------------------
# Es el tercer incidente de la misma familia: ENG-96 (el seed nunca corrió y el
# catálogo de especialidades estuvo vacío en Supabase por meses), ENG-122 (las
# migraciones no se aplicaban en el deploy) y ahora esto. En los tres casos el
# problema no fue la configuración en sí, sino DÓNDE vivía: en el dashboard de
# Render, fuera del repositorio, sin log, sin que ningún PR la mostrara y sin
# nada que avisara cuando faltaba.
#
# La conclusión que quedó escrita en el workflow de ENG-122 aplica igual acá:
# un paso del que se depende y que nadie puede ver es peor que no tenerlo.
#
# ---------------------------------------------------------------------------
# OJO: para que Render LEA este archivo, el servicio tiene que estar asociado a
# un Blueprint
# ---------------------------------------------------------------------------
# Si el static site se creó a mano desde el dashboard (que es el caso hoy),
# Render NO lee este archivo y la Rewrite Rule hay que cargarla a mano en
# Settings → Redirects/Rewrites.
#
# Mientras eso siga así, este archivo cumple dos funciones:
#   1. Documentar cuál es la configuración esperada, para que se pueda comparar
#      contra lo que hay cargado en el dashboard.
#   2. Ser la base de la migración a Blueprint, que es lo que cierra el problema
#      de raíz y está pendiente en ENG-124.
#
# Si migran el servicio a Blueprint, verifiquen que `buildCommand` y
# `staticPublishPath` coincidan con lo que hoy tiene cargado el dashboard antes
# de aplicar, o el primer deploy por Blueprint puede salir distinto al actual.

services:
  - type: web
    name: mediconnect-web
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    staticPublishPath: ./dist

    # El deploy lo dispara `deploy-production.yml` con el hook de Render, y solo
    # después de que CI pase sobre `main` (workflow_run + conclusion == success).
    # Por eso el servicio tiene hoy Auto-Deploy = No en el dashboard.
    #
    # En un Blueprint `autoDeploy` viene en `true` por defecto, así que migrar el
    # servicio con este archivo SIN esta línea reactivaría el deploy automático en
    # cada push a `main`, en paralelo al workflow y salteándose el gate de CI que
    # exige Sprint 0 §2.6. Sería el mismo tipo de incidente que este archivo viene
    # a cerrar.
    autoDeploy: false

    envVars:
      # El CI pinea pnpm 10 explícito (`pnpm/action-setup` con `version: 10`).
      # Acá hay que pinearlo igual: `pnpm-workspace.yaml` usa `allowBuilds`, que
      # es sintaxis de pnpm 10+, y con pnpm 9 el install falla con
      # ERR_PNPM_IGNORED_BUILDS y se rompe el build entero.
      #
      # Se fija por env var y NO con `packageManager` en package.json:
      # `pnpm/action-setup@v4` aborta por versión duplicada si ese campo existe
      # y además está el input `version`, así que agregarlo ahí rompería el CI.
      - key: PNPM_VERSION
        value: "10"
      # Espeja `.nvmrc`, que es de donde toma la versión el CI. Render suele
      # respetar `.nvmrc`, pero el build corre `tsc -b` y no conviene que la
      # versión de Node dependa de una inferencia.
      - key: NODE_VERSION
        value: "24"

    routes:
      # La regla que faltaba. Sin esto, el static site busca un archivo en cada
      # ruta (`/profesionales`, `/ingresar`, …) y devuelve 404 text/plain, porque
      # esas rutas no son archivos: las resuelve React Router en el cliente.
      #
      # Tiene que ser `rewrite` y no `redirect`. Un redirect cambiaría la URL en
      # la barra del navegador, y entonces el deep link —que es justamente lo que
      # se quiere arreglar— seguiría sin funcionar.
      #
      # Los archivos que existen en el build (`/assets/*`, `/favicon.svg`,
      # `/logo.png`) se siguen sirviendo con su content-type: la regla actúa
      # cuando no hay archivo que coincida. Está como criterio de aceptación en
      # ENG-124 y hay que verificarlo después de aplicarla, no darlo por hecho.
      - type: rewrite
        source: /*
        destination: /index.html

    # Headers de seguridad del sitio (Sprint 0 §5.5.4 y §4.8.3, ENG-166).
    #
    # Igual que la Rewrite Rule de arriba: mientras el servicio no esté en un
    # Blueprint, Render NO lee esto y hay que cargarlos a mano en Settings →
    # Headers, con path `/*`.
    #
    # La CSP permite solo lo que la web usa de verdad:
    #   - script: los propios (Vite empaqueta todo, no hay scripts de terceros).
    #   - style: los propios, Google Fonts y `'unsafe-inline'` para los `style`
    #     que pone React (barras de progreso, anchos calculados).
    #   - font: Google Fonts.
    #   - img: las propias, `data:`/`blob:` (el QR y avatares) y https (fotos de
    #     perfil del storage de Supabase).
    #   - connect: el backend, Supabase (REST y Realtime del chat) y Sentry.
    #   - frame: Daily, que es el iframe de la videoconsulta.
    # MercadoPago no aparece porque se llega con una redirección de página
    # entera, que la CSP no restringe.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://mediconnect-backend-smss.onrender.com https://*.supabase.co wss://*.supabase.co https://*.ingest.sentry.io https://*.ingest.us.sentry.io; frame-src https://*.daily.co; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # La videoconsulta pide cámara y micrófono dentro del iframe de Daily: se
      # habilitan solo para la propia página y para Daily.
      - path: /*
        name: Permissions-Policy
        value: camera=(self "https://*.daily.co"), microphone=(self "https://*.daily.co"), geolocation=()

