name: CI

# Calidad del frontend web, alineado a la matriz 3.5.4 del Sprint 0.
# El web NO tiene suite de integración (eso es del backend), así que el pipeline
# es lint + type-check + unit, más el build a partir del PR a release.
#
#   PR (contra cualquier base)   -> lint + type-check + unit + build
#   push a release/** · main     -> lint + type-check + unit + build
#
# Los filtros que había en `pull_request` (`release/**` y `main`) dejaban sin
# ningún check a los PR apilados sobre otra rama de feature —como ENG-55 sobre
# ENG-54—, aunque la protección de rama los exige para mergear. Se saca el filtro
# en vez de sumar prefijos: cualquier PR tiene que estar gateado, sin importar la
# base, y una lista de prefijos se vuelve a romper cuando cambie la convención de
# ramas.
#
# `types` incluye `edited` justamente por ese caso: al mergear el PR de abajo,
# GitHub reapunta el de arriba y emite `pull_request: edited`, que NO está en los
# types por defecto (`opened`, `synchronize`, `reopened`). Sin él, los checks
# calculados contra la base vieja seguirían pegados al head SHA y alcanzarían
# para mergear contra una base que nunca se probó.
#
# `push` NO se amplía a todas las ramas. Sería tentador para tener feedback al
# pushear, pero `Build (producción)` no es un job aparte: es un step del job
# `quality`, cuyo `name` es el contexto que exige el ruleset. Un push a una rama
# con PR abierto publicaría un segundo check run HOMÓNIMO que saltea ese step, y
# ante un fallo de build uno quedaría rojo y el otro verde sobre el mismo SHA,
# sin garantía de cuál decide el gate.
on:
  push:
    branches:
      - 'release/**'
      - 'main'
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Cancela runs obsoletos del mismo ref: si pusheás dos veces seguidas, el primero
# se descarta en vez de encolarse. Ahorra minutos de runner.
#
# Se agrupa por `github.ref` y NO por `head_ref || ref_name`. Unificarlos haría
# que el run de `push` y el de `pull_request` se cancelen entre sí, y como los dos
# disparan casi a la vez, `cancel-in-progress` mataría al que arrancó primero sin
# determinismo sobre cuál. Con `push` limitado a `release/**` y `main` los dos
# runs corren la suite completa, así que el solape no debilita nada: son ~40s de
# más en las ramas de release y ninguno en las de feature.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Type-check · Unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:run

      - name: Build (producción)
        # El doc pone el build a partir del PR a release, no en el push a feature.
        # En CI valida que compile; el build real que se publica lo hace Render
        # (con sus env VITE_*) al dispararse el deploy.
        if: github.event_name == 'pull_request' || startsWith(github.ref_name, 'release/') || github.ref_name == 'main'
        run: pnpm run build
