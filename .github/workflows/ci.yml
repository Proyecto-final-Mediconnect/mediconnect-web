name: CI

# Calidad del frontend web, alineado a la matriz 3.5.4 del Sprint 0.
# El web NO tiene suite de integración (eso es del backend), así que el pipeline
# es lint + type-check + unit, más el build a partir del PR a release.
#
#   push a cualquier rama        -> lint + type-check + unit
#   PR (contra cualquier base)   -> lint + type-check + unit + build
#   push a release/** · main     -> lint + type-check + unit + build
#
# Los filtros de rama que había acá no matcheaban ninguna rama real: el equipo
# nombra las ramas como las genera Linear (`<usuario>/eng-NN-titulo`), y
# `feature/**` / `bugfix/**` quedaron de las dos ramas previas a esa convención.
# Resultado: el trigger de `push` no se disparaba nunca, y un PR apilado sobre
# otra rama de feature —como ENG-55 sobre ENG-54— no recibía ningún check,
# aunque la protección de rama los exige para mergear.
on:
  push:
    branches:
      - '**'
  pull_request:

# Cancela runs obsoletos de la misma rama. Se agrupa por `head_ref` cuando el
# evento es un PR: sin eso, cada push a una rama con PR abierto arrancaría DOS
# runs —el de `push` y el de `pull_request`— en grupos distintos, y ninguno
# cancelaría al otro. Con `head_ref` comparten grupo y sobrevive el último.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Type-check · Unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:run

      - name: Build (producción)
        # El doc pone el build a partir del PR a release, no en el push a feature.
        # En CI valida que compile; el build real que se publica lo hace Render
        # (con sus env VITE_*) al dispararse el deploy.
        if: github.event_name == 'pull_request' || startsWith(github.ref_name, 'release/') || github.ref_name == 'main'
        run: pnpm run build
